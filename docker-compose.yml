services:
  db:
    image: postgis/postgis:16-3.4
    container_name: desmat_db
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-marcos_gis}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-senha_agro_2026}
      - POSTGRES_DB=${POSTGRES_DB:-monitoramento_territorial}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d

volumes:
  pgdata:

